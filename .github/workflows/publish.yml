name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  npm:
    if: ${{ startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - run: pnpm install --frozen-lockfile
      - name: Verify release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node --print "require('./packages/cli/package.json').version")
          test "$GITHUB_REF_NAME" = "v${version}"
          git fetch origin main --depth=1
          release_sha=$(git rev-parse HEAD)
          test "$release_sha" = "$(git rev-parse origin/main)"
          successful_runs=$(gh api -X GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$release_sha&status=completed&per_page=100" \
            --jq "[.workflow_runs[] | select(.head_sha == \"$release_sha\" and .head_branch == \"main\" and .event == \"push\" and .conclusion == \"success\")] | length")
          test "$successful_runs" -ge 1
      - run: pnpm run build
      - run: git diff --exit-code -- packages/action/dist/index.cjs
      - name: Verify candidate artifacts
        run: node scripts/test-candidate-install.mjs "$(git rev-parse HEAD)" > "$RUNNER_TEMP/candidate-install-evidence.json"
      - id: registry
        run: |
          version=$(node --print "require('./packages/cli/package.json').version")
          if npm view "sutura@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.registry.outputs.exists != 'true' }}
        run: npm publish --access public
        working-directory: packages/cli
      - if: ${{ steps.registry.outputs.exists == 'true' }}
        run: |
          version=$(node --print "require('./packages/cli/package.json').version")
          echo "sutura@$version is already published."
      - name: Verify public npm and Action artifacts
        run: node scripts/test-public-install.mjs --candidate-evidence "$RUNNER_TEMP/candidate-install-evidence.json" > "$RUNNER_TEMP/public-install-evidence.json"
      - name: Compare candidate and public artifacts
        run: |
          test "$(jq -r .packageVersion "$RUNNER_TEMP/candidate-install-evidence.json")" = "$(jq -r .packageVersion "$RUNNER_TEMP/public-install-evidence.json")"
          test "$(jq -r .actionCommit "$RUNNER_TEMP/candidate-install-evidence.json")" = "$(jq -r .actionCommit "$RUNNER_TEMP/public-install-evidence.json")"
          test "$(jq -r .packageContentHash "$RUNNER_TEMP/candidate-install-evidence.json")" = "$(jq -r .packageContentHash "$RUNNER_TEMP/public-install-evidence.json")"
      - uses: actions/upload-artifact@v7
        with:
          name: sutura-v0.2.1-install-evidence
          path: |
            ${{ runner.temp }}/candidate-install-evidence.json
            ${{ runner.temp }}/public-install-evidence.json
          if-no-files-found: error
