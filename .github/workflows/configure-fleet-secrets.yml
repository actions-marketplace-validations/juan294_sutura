name: Configure fleet secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        repository:
          - frivas/roots
          - jordanrlynn89/gardening-whisperer
          - jajgarcia/ads-refs
          - miguelmoyalorman/aisc
    env:
      GH_TOKEN: ${{ secrets.FLEET_CONFIG_PAT }}
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
      CONTREE_TOKEN: ${{ secrets.CONTREE_TOKEN }}
      CONTREE_PROJECT: ${{ vars.CONTREE_PROJECT }}
      TARGET_REPOSITORY: ${{ matrix.repository }}
    steps:
      - name: Copy provider configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$NEBIUS_API_KEY"
          test -n "$CONTREE_TOKEN"
          test -n "$CONTREE_PROJECT"
          printf '%s' "$NEBIUS_API_KEY" | gh secret set NEBIUS_API_KEY --repo "$TARGET_REPOSITORY"
          printf '%s' "$CONTREE_TOKEN" | gh secret set CONTREE_TOKEN --repo "$TARGET_REPOSITORY"
          gh variable set CONTREE_PROJECT --repo "$TARGET_REPOSITORY" --body "$CONTREE_PROJECT"
