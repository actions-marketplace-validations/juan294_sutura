name: Sutura Verified Self-Healing CI
description: Verify failed CI, filter flaky failures, reject unsafe shortcuts, and open an evidence-backed repair PR.
author: Sutura

inputs:
  mode:
    description: heal generates a repair; verify executes only the supplied patch with required trusted challenges and read-only repository access.
    required: false
    default: heal
  github-token:
    description: GitHub token for failed-run and source reads. Heal mode also publishes the comment, check, and repair pull request; verify mode requires only repository read access.
    required: true
  run-id:
    description: Numeric ID of the failed GitHub Actions workflow run.
    required: true
  nebius-api-key:
    description: Nebius Token Factory API key for Nemotron inference.
    required: true
  tavily-api-key:
    description: Optional Tavily API key for grounded dependency diagnosis.
    required: false
  contree-token:
    description: Nebius ConTree token used for sandbox operations.
    required: true
  contree-project:
    description: Nebius ConTree project ID.
    required: true
  triage-n:
    description: Maximum independent failure reproductions; progressive confidence can stop earlier.
    required: false
    default: '5'
  routing-profile:
    description: Price-verified model-selection profile. Incomplete profiles cannot change defaults.
    required: false
    default: production-baseline-v1
  source-sha:
    description: Exact 40-character commit whose failure is being verified. Required only by the verification route.
    required: false
  policy-base-sha:
    description: Exact 40-character commit supplying the operator-trusted repository policy. A supplied patch cannot choose it.
    required: false
  candidate-diff:
    description: Unified diff produced by another agent, verified as supplied. This route never authors a replacement or writes to the repository.
    required: false
  failing-command:
    description: Identifier of the trusted failing command to reproduce. Must resolve through the trusted command map, not arbitrary text.
    required: false
  require-fixed:
    description: Fail the action unless Sutura produces a fixed outcome. Intended for strict self-hosting and acceptance gates.
    required: false
    default: 'false'
  capture-replay:
    description: Capture credential-free external boundary data for offline repair replay.
    required: false
    default: 'false'
  runtime:
    description: Runtime selection for polyglot repositories. Auto fails closed when evidence is ambiguous.
    required: false
    default: auto
  repair-model-turns:
    description: Lower-only repair-agent model turn limit.
    required: false
    default: '8'
  repair-tool-calls:
    description: Lower-only repair-agent tool call limit.
    required: false
    default: '24'
  repair-branches:
    description: Lower-only repair-agent branch limit.
    required: false
    default: '12'
  repair-sandbox-operations:
    description: Lower-only repair-agent sandbox operation limit.
    required: false
    default: '32'
  repair-elapsed-time-sec:
    description: Lower-only repair-agent elapsed-time limit in seconds.
    required: false
    default: '600'
  repair-inference-cost-usd:
    description: Lower-only repair-agent inference-cost limit in USD.
    required: false
    default: '0.25'
  repair-diff-bytes:
    description: Lower-only cumulative repair diff limit in bytes.
    required: false
    default: '65536'
  search-initial-branches:
    description: Initial adaptive checkpoint branches.
    required: false
    default: '4'
  search-beam-width:
    description: Maximum adaptive checkpoint frontier width.
    required: false
    default: '2'
  search-max-depth:
    description: Maximum adaptive checkpoint search depth.
    required: false
    default: '4'
  search-max-total-branches:
    description: Lower-only global adaptive checkpoint branch limit.
    required: false
    default: '12'
  model-nano:
    description: Optional Nemotron classifier model override.
    required: false
  model-super:
    description: Optional verified Nemotron repair model selector. Unsupported model IDs fail closed.
    required: false
  model-ultra:
    description: Optional Nemotron adversarial-audit model override.
    required: false

outputs:
  outcome:
    description: Final Sutura outcome for the failed run.
  verification-status:
    description: Terminal supplied-patch verification status in verify mode.

runs:
  using: node24
  main: dist/index.cjs

branding:
  icon: activity
  color: red
