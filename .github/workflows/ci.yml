name: CI

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:release-contracts
      - run: pnpm run test:readme
      - run: pnpm run verify:readme-setup
      - run: pnpm --filter placebo run smoke:offline
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build
      - run: node scripts/verify-bundle.mjs
      - run: pnpm run test:package
      - run: pnpm run test
      - run: pnpm run guards:verify
