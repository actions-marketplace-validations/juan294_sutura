<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #E0FF4F; } a:hover { color: #D1F42F; }
    .tile { width: 100px; height: 100px; box-sizing: border-box; border-radius: 20px; background: rgba(255,255,255,0.035); display: flex; align-items: center; justify-content: center; }
    .stage { width: 148px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .lbl { font-family: 'Helvetica Neue', Helvetica, sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 0.08em; color: #9BB0BD; }
    .arrow { margin-top: 42px; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 1200px; height: 800px; box-sizing: border-box; padding: 72px; background: #052B42;">

  <div style="font-family: 'Superclarendon', 'Rockwell', Georgia, serif; font-weight: 700; font-size: 168px; line-height: 0.9; letter-spacing: -0.022em; color: #FFFFFF;">Sutura</div>
  <div style="height: 10px;"></div>
  <div style="font-family: 'Helvetica Neue', Helvetica, sans-serif; font-weight: 700; font-size: 50px; line-height: 1; letter-spacing: -0.012em; color: #E0FF4F;">Verified Self-Healing CI</div>
  <div style="height: 24px;"></div>
  <div style="font-family: 'Menlo', 'SF Mono', ui-monospace, monospace; font-size: 24px; line-height: 1.45; text-align: center; color: #9BB0BD;">AI agents can make CI pass.<br>Sutura verifies they actually fixed the problem.</div>

  <div style="height: 34px;"></div>

  <svg viewBox="0 0 1056 44" width="1056" height="44" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M4 22 L1052 22" stroke="#E0FF4F" stroke-width="6" stroke-linecap="round"></path>
    <g stroke="#E0FF4F" stroke-width="6" stroke-linecap="round">
      <path d="M470 6 L498 38 M498 6 L470 38"></path>
      <path d="M492 6 L520 38 M520 6 L492 38"></path>
      <path d="M514 6 L542 38 M542 6 L514 38"></path>
      <path d="M536 6 L564 38 M564 6 L536 38"></path>
      <path d="M558 6 L586 38 M586 6 L558 38"></path>
    </g>
  </svg>

  <div style="height: 38px;"></div>

  <div style="display: flex; align-items: flex-start;">

    <div class="stage">
      <div class="tile" style="border: 2px solid #F4564A;">
        <svg viewBox="0 0 48 48" width="46" height="46" fill="none" stroke="#F4564A" stroke-width="3.2" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="17"></circle>
          <path d="M17.5 17.5 L30.5 30.5 M30.5 17.5 L17.5 30.5"></path>
        </svg>
      </div>
      <span class="lbl" style="color: #F4564A;">FAILS</span>
    </div>

    <svg class="arrow" viewBox="0 0 40 16" width="40" height="16" fill="none" stroke="#B4564C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M2 8 H32 M26 3 L32 8 L26 13"></path></svg>

    <div class="stage">
      <div class="tile" style="border: 2px solid #2C6A88;">
        <svg viewBox="0 0 48 48" width="46" height="46" fill="none" stroke="#8FB6C9" stroke-width="3.2" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg">
          <circle cx="21" cy="21" r="13"></circle>
          <path d="M30.5 30.5 L41 41"></path>
        </svg>
      </div>
      <span class="lbl">DIAGNOSE</span>
    </div>

    <svg class="arrow" viewBox="0 0 40 16" width="40" height="16" fill="none" stroke="#45758F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M2 8 H32 M26 3 L32 8 L26 13"></path></svg>

    <div class="stage">
      <div class="tile" style="border: 2px solid #2C6A88;">
        <svg viewBox="0 0 48 48" width="46" height="46" fill="none" stroke="#8FB6C9" stroke-width="3.2" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="24" r="4.5" fill="#8FB6C9" stroke="none"></circle>
          <circle cx="37" cy="13" r="4.5" fill="#8FB6C9" stroke="none"></circle>
          <circle cx="37" cy="35" r="4.5" fill="#8FB6C9" stroke="none"></circle>
          <path d="M16.5 24 H25 M25 24 L33 14.5 M25 24 L33 33.5"></path>
        </svg>
      </div>
      <span class="lbl">REPRODUCE</span>
    </div>

    <svg class="arrow" viewBox="0 0 40 16" width="40" height="16" fill="none" stroke="#7FA85C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M2 8 H32 M26 3 L32 8 L26 13"></path></svg>

    <div class="stage">
      <div class="tile" style="border: 3px solid #E0FF4F; box-shadow: 0 0 26px rgba(224,255,79,0.32);">
        <svg viewBox="0 0 48 48" width="46" height="46" fill="none" stroke="#E0FF4F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 6 L39 12 V25 C39 34 32 40.5 24 43 C16 40.5 9 34 9 25 V12 Z"></path>
          <path d="M17 24 L22 29 L32 18"></path>
        </svg>
      </div>
      <span class="lbl" style="color: #E0FF4F;">AUDIT</span>
    </div>

    <svg class="arrow" viewBox="0 0 40 16" width="40" height="16" fill="none" stroke="#E0FF4F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M2 8 H32 M26 3 L32 8 L26 13"></path></svg>

    <div class="stage">
      <div class="tile" style="border: 2px solid #9BC943;">
        <svg viewBox="0 0 48 48" width="46" height="46" fill="none" stroke="#C6E86A" stroke-width="3.2" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg">
          <circle cx="15" cy="11" r="4.5" fill="#C6E86A" stroke="none"></circle>
          <circle cx="15" cy="37" r="4.5" fill="#C6E86A" stroke="none"></circle>
          <circle cx="34" cy="11" r="4.5" fill="#C6E86A" stroke="none"></circle>
          <path d="M15 15.5 V32.5"></path>
          <path d="M34 15.5 C34 27 15 24 15 32.5"></path>
        </svg>
      </div>
      <span class="lbl" style="color: #C6E86A;">FIX PR</span>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
