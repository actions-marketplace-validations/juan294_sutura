name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What repair or verification problem should this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should it work?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Acceptance Evidence
      description: What deterministic evidence should prove the feature works?
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Safety Boundaries
      description: Note effects on untrusted code, network access, tokens, tests, or human approval.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider?
